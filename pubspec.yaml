name: flutter_application_1
description: "A new Flutter project."
# The following line prevents the package from being accidentally published.
publish_to: 'none'

# Define the version and build number
version: 1.0.0+1

environment:
  # Relax the SDK constraint to allow for minor Dart updates (recommended)
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Core Flutter packages
  cupertino_icons: ^1.0.8
  
  # Utility packages
  intl: ^0.20.2
  rive_animated_icon: ^2.0.5
  lucide_icons: ^0.257.0 # Updated to a recent version
  
  # Syncfusion (sliders/core should be on the same version)
  syncfusion_flutter_sliders: ^31.2.2 # Updated to latest stable version
  syncfusion_flutter_core: ^31.2.2 # Added for consistency with sliders

  # Audio Packages (Critical for dynamic player)
  just_audio: ^0.10.5
  rxdart: ^0.27.7 # You may update to ^0.28.0 if compatible with just_audio 
  
  # Background Audio and Notifications (Using working beta version)
  just_audio_background: ^0.0.1-beta.17
  audio_service: ^0.18.18


dev_dependencies:
  flutter_test:
    sdk: flutter

  # Updated to a more recent major version for current best practices
  flutter_lints: ^3.0.0 

# For information on the generic Dart part of this file, see the Dart pub documentation.

flutter:
  uses-material-design: true

  # Asset declaration is correct for the audio files
  assets:
    - assets/broadband/
    - assets/classical/
    - assets/nature/
    - assets/binaural/
    - assets/asmr/
    - assets/lullaby/